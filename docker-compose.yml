services:
  postgres:
    image: postgres:16-alpine
    container_name: videoclub-db
    environment:
      POSTGRES_DB: videoclub
      POSTGRES_USER: videoclub
      POSTGRES_PASSWORD: videoclub123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videoclub -d videoclub"]
      interval: 10s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: videoclub-seq
    ports:
      - "5341:5341" 
      - "8081:80"   
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    volumes:
      - seqdata:/data

volumes:
  pgdata:
  seqdata:


