events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Habilitar compresión gzip para archivos WASM y JS
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/wasm
        application/octet-stream
        image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Soporte para Blazor WASM .br (Brotli pre-comprimido)
        location ~* \.js\.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/javascript;
        }

        location ~* \.wasm\.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/wasm;
        }

        location ~* \.dll\.br$ {
            add_header Content-Encoding br;
            add_header Content-Type application/octet-stream;
        }

        # Soporte para Blazor WASM .gz (Gzip pre-comprimido)
        location ~* \.js\.gz$ {
            add_header Content-Encoding gzip;
            add_header Content-Type application/javascript;
        }

        location ~* \.wasm\.gz$ {
            add_header Content-Encoding gzip;
            add_header Content-Type application/wasm;
        }

        # Cache de larga duración para assets con hash
        location ~* \.(js|css|wasm|dll|dat|blat)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # No cachear index.html (entry point)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Fallback SPA: todas las rutas sirven index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}